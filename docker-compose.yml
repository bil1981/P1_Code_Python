services:

  api:
    build: .
    container_name: mlops_api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./Data:/app/Data  
    restart: unless-stopped

  streamlit:
    build: .
    container_name: mlops_streamlit
    command: streamlit run app/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./Data:/app/Data
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    restart: unless-stopped